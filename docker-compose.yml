# LoRaWAN Sensor Network - Complete Docker Stack
# Includes: InfluxDB, Grafana, Mosquitto (local MQTT), and MQTT Bridge
#
# Usage:
#   docker compose up -d      # Start all services
#   docker compose down       # Stop all services
#   docker compose logs -f    # View logs

services:
  # InfluxDB - Time-series database for sensor data
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123456
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=lorawan
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    restart: unless-stopped
    networks:
      - lorawan-network

  # Grafana - Visualization dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    networks:
      - lorawan-network
    depends_on:
      - influxdb

  # Mosquitto - Local MQTT broker (optional, for testing)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - lorawan-network

  # MQTT Bridge - Connects to RAK gateway MQTT and writes to InfluxDB
  mqtt-bridge:
    image: python:3.11-slim
    container_name: mqtt-bridge
    working_dir: /app
    command: python3 mqtt_to_influx.py
    volumes:
      - ./mqtt_to_influx.py:/app/mqtt_to_influx.py:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - lorawan-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - influxdb

networks:
  lorawan-network:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
