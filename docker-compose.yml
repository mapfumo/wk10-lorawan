# LoRaWAN Data Pipeline - Python MQTT→InfluxDB Bridge
# Connects to existing Week 7 infrastructure (influxdb, grafana)

services:
  mqtt-bridge:
    image: python:3.11-slim
    container_name: wk10-mqtt-bridge
    working_dir: /app
    command: python3 mqtt_to_influx.py
    volumes:
      - ./mqtt_to_influx.py:/app/mqtt_to_influx.py:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - wk7-mqtt-influx_iiot-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  wk7-mqtt-influx_iiot-network:
    external: true
