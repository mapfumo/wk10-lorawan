[package]
name = "lora-2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embassy async framework
embassy-executor = { version = "0.6.3", features = ["arch-cortex-m", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3.2", features = ["tick-hz-32_768"] }
embassy-stm32 = { version = "0.1.0", features = [
    "stm32wl55jc-cm4",      # STM32WL55JC Cortex-M4 core
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "exti",
] }
embassy-sync = "0.6.1"

# Cortex-M runtime
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# Panic handler
panic-probe = { version = "0.3", features = ["print-defmt"] }

# Logging
defmt = "0.3"
defmt-rtt = "0.4"

# Display driver
sh1106 = "0.5"  # OLED display driver (SH1106 128x64)
embedded-graphics = "0.8"  # Graphics primitives
heapless = "0.8"  # No-std string formatting

# Sensor drivers (to be added when implementing BME688)
# bme680 = "0.6"  # BME688 sensor driver
# embedded-hal = "1.0"  # Hardware abstraction layer traits

# LoRaWAN stack (to be determined - options: lora-phy, embassy-lora)
# Will likely need direct SubGHz peripheral access via PAC

[profile.release]
debug = 2  # Full debug symbols for probe-rs
lto = "fat"
opt-level = "z"  # Optimize for size

[profile.dev]
debug = 2
opt-level = 1
