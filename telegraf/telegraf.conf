# Telegraf Configuration for LoRaWAN Gateway MQTT → InfluxDB
# Subscribes to RAK7268V2 gateway and writes decoded sensor data to InfluxDB

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "lorawan-telegraf"
  omit_hostname = false

# Output to InfluxDB 2.x (Week 7 infrastructure)
[[outputs.influxdb_v2]]
  urls = ["http://wk7-influxdb:8086"]
  token = "my-super-secret-auth-token"
  organization = "my-org"
  bucket = "lorawan"

# Input from RAK7268V2 Gateway MQTT Broker
[[inputs.mqtt_consumer]]
  servers = ["tcp://10.10.10.254:1883"]
  topics = ["application/TOT/device/+/rx"]
  qos = 0
  connection_timeout = "30s"
  client_id = "telegraf-lorawan"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "lorawan_uplink"

    # Extract device EUI from JSON
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "devEUI"
      rename = "dev_eui"

    # Extract radio metadata
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rxInfo.0.rssi"
      rename = "rssi"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rxInfo.0.loRaSNR"
      rename = "snr"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fCnt"
      rename = "frame_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "fPort"
      rename = "port"
      type = "int"

    # Store raw payload for Starlark processing
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data"
      rename = "payload_base64"
      type = "string"

# Starlark processor to decode base64 payload and extract sensor values
[[processors.starlark]]
  source = '''
load("encoding/base64", "base64")

LORA1_DEVEUI = "23ce1bfeff091fac"
LORA2_DEVEUI = "24ce1bfeff091fac"

def apply(metric):
    payload_b64 = metric.fields.get("payload_base64", "")
    dev_eui = metric.tags.get("dev_eui", "").lower()

    if not payload_b64 or not dev_eui:
        return metric

    # Decode base64
    payload = base64.decode(payload_b64)
    if len(payload) < 4:
        return metric

    # Parse based on device
    if dev_eui == LORA1_DEVEUI:
        # LoRa-1: 4 bytes - temp(i16 BE), humidity(u16 BE)
        temp_raw = (payload[0] << 8) | payload[1]
        if temp_raw > 32767:
            temp_raw = temp_raw - 65536  # Convert to signed
        hum_raw = (payload[2] << 8) | payload[3]

        metric.fields["temperature"] = temp_raw / 100.0
        metric.fields["humidity"] = hum_raw / 100.0
        metric.tags["node"] = "lora1_sht41"
        metric.tags["sensor"] = "SHT41"

    elif dev_eui == LORA2_DEVEUI:
        # LoRa-2: 8+ bytes - temp(i16), hum(u16), press(u16), gas(u16)
        if len(payload) >= 8:
            temp_raw = (payload[0] << 8) | payload[1]
            if temp_raw > 32767:
                temp_raw = temp_raw - 65536
            hum_raw = (payload[2] << 8) | payload[3]
            press_raw = (payload[4] << 8) | payload[5]
            gas_raw = (payload[6] << 8) | payload[7]

            metric.fields["temperature"] = temp_raw / 100.0
            metric.fields["humidity"] = hum_raw / 100.0
            metric.fields["pressure"] = press_raw / 10.0
            metric.fields["gas_resistance"] = float(gas_raw)
            metric.tags["node"] = "lora2_bme680"
            metric.tags["sensor"] = "BME680"

    # Remove raw payload to save space
    metric.fields.pop("payload_base64")

    return metric
'''
